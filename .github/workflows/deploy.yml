name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Execute deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }}
          script: |
            echo "🚀 Starting Deployment..."
            echo "📥 Cloning latest code from GitHub..."
            rm -rf /tmp/campusfix_repo
            git clone https://github.com/daffafairuzd/campus-fix.git /tmp/campusfix_repo
            
            echo "🔄 Syncing backend files to production..."
            cp -R /tmp/campusfix_repo/backend/* /var/www/campusfix/
            cp /tmp/campusfix_repo/backend/.env.example /var/www/campusfix/ 2>/dev/null || true
            
            cd /var/www/campusfix
            
            echo "📦 Installing PHP dependencies..."
            composer install --no-dev --optimize-autoloader
            
            echo "🗄️ Running database migrations..."
            php artisan migrate --force
            
            echo "🧹 Clearing and caching configurations..."
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            echo "🔄 Restarting Queue Workers..."
            php artisan queue:restart
            
            echo "🔧 Fixing permissions for Nginx/PHP..."
            cd /var/www/campusfix
            chown -R www-data:www-data /var/www/campusfix
            
            echo "✅ Deployment Successful!"
